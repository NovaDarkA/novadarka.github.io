name: Shoefit quality
on:
  push:
    branches: [main, develop/shoefit-fullstack]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify static output contains no server files
        run: |
          test -f dist/index.html
          test -f dist/login.html
          test ! -e dist/api
          test ! -e dist/src
          test ! -e dist/.env.example
