  <link rel="icon" href="img/optimized/logo-marca.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/media_query.css">

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <!-- SHARED_HEADER -->

  <main id="contenido" class="account-recovery">
    <section class="account-recovery-card" aria-labelledby="recovery-title">
      <a class="account-crumb" href="login.html">← Volver a iniciar sesión</a>
      <h1 id="recovery-title">Recuperar contraseña</h1>
      <p>Introduce el correo asociado a tu cuenta para recibir las instrucciones de recuperación.</p>
      <p class="account-notice">Vista previa: todavía no se envían correos. No introduzcas datos reales.</p>
      <div class="account-fields"><label class="account-wide">Correo electrónico<input type="email" placeholder="correo@ejemplo.com" disabled></label></div>
      <button type="button" class="account-primary" disabled>Enviar enlace de recuperación</button>
      <a href="login.html" class="account-secondary">Regresar al login</a>
    </section>
  </main>
  <script>document.documentElement.classList.add("js");</script>
